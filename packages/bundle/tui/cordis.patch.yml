# The dsh-tui bundle patch: interactive terminal UI directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses `--resume` / `--session` and
# this app's --help, then the runtime owns the TTY through pi-tui.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the session exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the other
    # shipped profiles. Unset keeps the schema default (native).
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # Whole-log turn/step counts and LLM/tool/first-token/decode wall times,
    # served through the shared session-projection seam so the TUI stats row
    # shows full-session figures that paging and compaction cannot change.
    # token-meter (tokenUsage/contextPressure/contextBreakdown) is already
    # mounted by dsh-base.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Host-plane services `tool-cordis` injects. The shipped `cordis` preset
    # mounts that toolset; without this row it waits for dynamicCordisRunner
    # and cordisInspect. The browser half stays off — TUI has no page.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: tui-startup
      name: '@deepseek-ai/dsh-tui/startup'

    # Reads resume from the ordinary tuiStartup provider. An empty resume
    # creates a fresh persisted session.
    - id: tui-runtime
      name: '@deepseek-ai/dsh-tui'
      inject: [tuiStartup]
      config:
        resume: !!js ctx.tuiStartup.resume

# The agent plane moves behind agent presets, the same split the Web surface
# uses. Host-plane rows that register tools, prompt sections, or per-agent
# services stay disabled here so a session does not see both the base copy
# and the standing mount. A rosterless overlay that removes `agent-presets`
# keeps today's host composition: `mount` is a no-op and these disables
# should be removed with it.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# Only the SHIPPED root is an assembly fact: `apps/cli`'s `composeProfile`
# patches it in. The writable root is `dsh-agent-presets`' own default.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
